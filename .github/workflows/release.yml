# Publishes the VS Code extension to the Marketplace when a version tag is pushed:
#   git tag v0.1.1 && git push origin v0.1.1
# Needs the repository secret VSCE_PAT (Azure DevOps token, scope Marketplace > Manage).
# An odd minor version (0.1.x, 0.3.x) is published as a pre-release, an even one as stable.
name: Release extension

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag matches package.json, pick the channel
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          minor=$(echo "$version" | cut -d. -f2)
          if [ $((minor % 2)) -eq 1 ]; then echo "CHANNEL_FLAG=--pre-release" >> "$GITHUB_ENV"; fi

      - name: Install
        run: npm ci

      - name: Python tests
        working-directory: .
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests

      - name: Extension tests (compile + lint + VS Code tests)
        run: xvfb-run -a npm test

      - name: Package
        run: npm run package -- $CHANNEL_FLAG

      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish $CHANNEL_FLAG --packagePath tokenguard-localpilot-*.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/tokenguard-localpilot-*.vsix
