name: Release (pre-release publish)

# Publishes the extension to the Visual Studio Marketplace and Open VSX when a
# v* tag is pushed, or on demand. Configure the repository secrets first:
#   VSCE_PAT — Azure DevOps PAT, all organizations, scope Marketplace > Manage
#   OVSX_PAT — Open VSX token (https://open-vsx.org/user-settings/tokens)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64]
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches the extension version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            0.*)   TAG="v${VERSION}";;                          # pre-release versions start with 0
            1.*)   TAG="v${VERSION%%.*}.${VERSION#*.}";;        # pre-release odd-minor bump
            *)     ::error::"Unexpected version $VERSION"; exit 1;;
          esac
          case "$TAG" in
            "$GITHUB_REF_NAME") ;;
            *) echo "tag $GITHUB_REF_NAME != version $TAG"; exit 1;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile and lint
        run: npm run compile && npm run lint

      - name: Package (${{ matrix.target }})
        run: npx @vscode/vsce package --target ${{ matrix.target }} --pre-release --no-dependencies

      - name: Publish to the Visual Studio Marketplace
        run: npx @vscode/vsce publish --target ${{ matrix.target }} --pre-release
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: |
          VSIX=$(ls "tokenguard-${{ matrix.target }}-0"* | head -1)
          npx ovsx publish --pre-release -p ${{ secrets.OVSX_PAT }} "$VSIX"

      - name: Upload the VSIX as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenguard-${{ matrix.target }}
          path: extension/*.vsix
