<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Images are limited to the extension itself: a model answer must not load remote URLs. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; font-src {{cspSource}}; img-src {{cspSource}} data:; script-src 'nonce-{{nonce}}';">
    <link rel="stylesheet" id="hljsLight" href="{{mediaUri}}/vendor/hljs-light.min.css">
    <link rel="stylesheet" id="hljsDark" href="{{mediaUri}}/vendor/hljs-dark.min.css">
    <link rel="stylesheet" href="{{mediaUri}}/chat/main.css">
    <title>LocalPilot</title>
</head>
<body>
    <div class="container">
        <header class="top">
            <div id="status" class="status">Connecting to LocalPilot backend…</div>
            <details id="cloudSection" class="section">
                <summary>Cloud model</summary>
                <div class="section-body">
                    <div class="model-row">
                        <label for="cloudProvider">Provider</label>
                        <select id="cloudProvider"></select>
                    </div>
                    <div class="model-row" id="cloudBaseUrlRow" hidden>
                        <label for="cloudBaseUrl">Base URL</label>
                        <input id="cloudBaseUrl" type="text" placeholder="https://api.groq.com/openai/v1" />
                    </div>
                    <div class="model-row">
                        <label for="cloudModel">Model</label>
                        <select id="cloudModel"></select>
                    </div>
                    <div class="model-row">
                        <label for="cloudKey">API key</label>
                        <input id="cloudKey" type="password" placeholder="paste key" />
                    </div>
                    <div class="choices">
                        <button id="saveCloudKey" class="secondary">Save key</button>
                        <button id="clearCloudKey" class="secondary">Clear</button>
                        <button id="testCloud" class="secondary">Test</button>
                    </div>
                    <div id="cloudState" class="muted"></div>
                </div>
            </details>
            <div class="model-row">
                <label for="localModel">Local model</label>
                <select id="localModel" title="Ollama model used for local inference"></select>
            </div>
            <div id="modelState" class="muted"></div>
            <div id="systemInfo" class="muted"></div>
        </header>
        <div id="topResizer" class="resizer" role="separator" aria-orientation="horizontal"
             title="Drag to resize the model panel" tabindex="0"></div>

        <main id="scroller" class="middle">
            <section id="empty" class="empty">
                <h2>Ask about your code</h2>
                <p>Simple questions run on your local model and never leave your machine. Complex ones can go to a
                    cloud LLM with only the relevant files, compressed and with secrets masked.</p>
                <div class="examples" id="examples"></div>
                <p id="contextHint" class="muted"></p>
                <p class="muted">Enter to send · Shift+Enter for a new line · Esc to stop</p>
            </section>

            <div id="history" class="chat-history"></div>
        </main>
        <div id="bottomResizer" class="resizer" role="separator" aria-orientation="horizontal"
             title="Drag to resize the composer" tabindex="0"></div>

        <footer class="bottom">
            <div class="model-row">
                <label for="mode">Mode</label>
                <select id="mode" title="Ask answers questions. Agent reads your code, proposes edits you review, and runs tests (with your approval).">
                    <option value="ask">Ask: answer questions</option>
                    <option value="agent-cloud">Agent: edit code with the global LLM</option>
                    <option value="agent-local">Agent: edit code with the local LLM</option>
                </select>
            </div>
            <textarea id="prompt" placeholder="Ask LocalPilot about your repository… (Enter to send, Shift+Enter for newline)"></textarea>
            <button id="send" title="Send (Enter)">Send Request</button>
        </footer>
    </div>

    <script nonce="{{nonce}}" src="{{mediaUri}}/vendor/marked.umd.js"></script>
    <script nonce="{{nonce}}" src="{{mediaUri}}/vendor/purify.min.js"></script>
    <script nonce="{{nonce}}" src="{{mediaUri}}/vendor/highlight.min.js"></script>
    <script nonce="{{nonce}}" src="{{mediaUri}}/chat/main.js"></script>
</body>
</html>
